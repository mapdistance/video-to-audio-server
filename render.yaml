services:
  - type: web
    name: facebook-audio-converter
    env: node
    buildCommand: npm install && apt-get update && apt-get install -y python3 python3-pip ffmpeg && pip3 install yt-dlp
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.17.0